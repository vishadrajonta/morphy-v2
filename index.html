<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morphy: Chess Openings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="knowledge.js" defer></script>
  <script src="chessbot.js" defer></script>
</head>
<body>
  <main class="chat">

    <header class="chat-header">
      <div class="board-strip" aria-hidden="true"></div>
      <h1>Morphy</h1>
      <p>Ask Morphy about chess openings!</p>
    </header>

    <!-- Messages appear here. JavaScript will add to this list later. -->
    <ul id="messages" class="messages" aria-live="polite">
    </ul>

    <form id="chat-form" class="chat-input">
      <label for="question" class="visually-hidden">Your question</label>
      <input
        id="question"
        type="text"
        placeholder="Ask a chess question"
        autocomplete="off"
      >
      <button type="submit">Send</button>
    </form>

  </main>
</body>
</html>
